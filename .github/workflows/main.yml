name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # 1. JOB DE INTEGRACIÓN CONTINUA (CI: Test)
  # ==========================================
  test:
    name: Run Unit Tests & Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests with Coverage (>70%)
        run: npm run test:coverage

  # ==========================================
  # 2. JOB DE ENTREGA CONTINUA (Delivery: Docker Hub)
  # ==========================================
  delivery:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/webapp-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/webapp-api:${{ github.sha }}

  # ==========================================
  # 3. JOB DE DESPLIEGUE CONTINUO (Deploy: AWS EC2)
  # ==========================================
  deployment:
    name: Deploy to AWS EC2
    needs: delivery
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Garantizar directorio persistente con permisos para el usuario node (UID 1000)
            mkdir -p /home/${{ secrets.EC2_USER }}/api-db
            sudo chown -R 1000:1000 /home/${{ secrets.EC2_USER }}/api-db || true
            chmod 775 /home/${{ secrets.EC2_USER }}/api-db || true

            # 2. Autenticar en Docker Hub en el servidor EC2
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # 3. Descargar la versión más reciente
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/webapp-api:latest

            # 4. Detener y remover contenedor previo si existe
            docker stop webapp-api || true
            docker rm webapp-api || true

            # 5. Levantar el nuevo contenedor mapeando puerto 80 a 3000 y montando el volumen persistente de SQLite
            docker run -d \
              --name webapp-api \
              --restart unless-stopped \
              -p 80:3000 \
              -v /home/${{ secrets.EC2_USER }}/api-db:/app/data \
              ${{ secrets.DOCKERHUB_USERNAME }}/webapp-api:latest

            # 6. Limpieza de imágenes huérfanas
            docker image prune -f
